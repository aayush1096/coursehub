services:
  - type: web
    name: coursehub
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: DATA_DIR
        value: /data
    disk:
      name: coursehub-data
      mountPath: /data
      sizeGB: 1
