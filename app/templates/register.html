{% extends "base.html" %}
{% block title %}Register - CourseHub{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h3 class="mb-1 fw-bold">Create an account</h3>
  <p class="text-muted mb-4">Join as a student to start learning.</p>
  <div id="regError" class="alert alert-danger d-none"></div>
  <form id="registerForm">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" minlength="6" required>
      <div class="form-text">At least 6 characters.</div>
    </div>
    <button type="submit" class="btn btn-primary w-100">Create account</button>
  </form>
  <p class="mt-3 text-center mb-0">
    Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var fd = new FormData(e.target);
  fetch('{{ url_for("auth.api_register") }}', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      username: fd.get('username'),
      email: fd.get('email'),
      password: fd.get('password')
    })
  }).then(function (r) { return r.json().then(function (d) { return {ok: r.ok, data: d}; }); })
    .then(function (res) {
      if (res.ok && res.data.success) {
        window.location.href = '{{ url_for("main.index") }}';
      } else {
        showErr(res.data.message || 'Registration failed.');
      }
    })
    .catch(function () { showErr('Network error. Try again.'); });
});

function showErr(msg) {
  var el = document.getElementById('regError');
  el.textContent = msg;
  el.classList.remove('d-none');
}
</script>
{% endblock %}
