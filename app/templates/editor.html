{% extends "base.html" %}
{% block title %}Code Editor - ArduinoHub{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/editor.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
{% endblock %}
{% block content %}
<div class="ide-container">
  <div class="ide-top">
    <!-- LEFT: Code Editor Panel -->
    <div class="editor-panel" id="editorPanel">
      <div class="editor-toolbar">
      <span class="toolbar-title">Sketch Editor</span>
      <button class="btn btn-sm btn-compile" id="btnCompile">Verify / Compile</button>
      <button class="btn btn-sm btn-start" id="btnStart">Start Simulation</button>
      <button class="btn btn-sm btn-stop" id="btnStop" disabled>Stop Simulation</button>
    </div>
    <div class="editor-wrapper">
      <div class="editor-area">
        <textarea id="codeEditor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">{{ hardware_profiles[0].default_code if hardware_profiles else 'void setup() {\n  pinMode(13, OUTPUT);\n  pinMode(2, INPUT_PULLUP);\n}\n\nvoid loop() {\n  digitalWrite(13, HIGH);\n  delay(1000);\n  digitalWrite(13, LOW);\n  delay(1000);\n}' }}</textarea>
        <div id="suggestions" class="suggestions-popup" style="display:none"></div>
      </div>
    </div>
  </div>

  <!-- Draggable Splitter -->
  <div class="splitter" id="splitter"></div>

  <!-- RIGHT: Hardware Canvas Panel -->
  <div class="canvas-panel" id="canvasPanel">
    <div class="canvas-header">
      <span class="header-title">Hardware Canvas</span>
      <div class="canvas-controls">
        <div class="factory-toolbar" id="factoryToolbar">
          <div class="factory-dropdown">
            <button class="btn btn-sm factory-toggle" id="factoryToggle">+ Add Component</button>
            <div class="factory-menu" id="factoryMenu">
              <div class="factory-section">
                <div class="factory-section-title">Outputs</div>
                <button class="factory-item" data-comp="led">LED</button>
                <button class="factory-item" data-comp="rgb_led">RGB LED</button>
                <button class="factory-item" data-comp="oled">OLED 128x64</button>
                <button class="factory-item" data-comp="buzzer">Buzzer</button>
              </div>
              <div class="factory-section">
                <div class="factory-section-title">Inputs</div>
                <button class="factory-item" data-comp="button">Push Button</button>
                <button class="factory-item" data-comp="potentiometer">Potentiometer</button>
                <button class="factory-item" data-comp="dht11">DHT11 Sensor</button>
                <button class="factory-item" data-comp="ultrasonic">Ultrasonic Sensor</button>
              </div>
              <div class="factory-section">
                <div class="factory-section-title">Passive</div>
                <button class="factory-item" data-comp="resistor">Resistor 220&#8486;</button>
              </div>
            </div>
          </div>
          <div class="instance-list" id="instanceList"></div>
        </div>
        <div class="canvas-divider"></div>
        <div class="zoom-controls">
          <button class="btn btn-sm zoom-btn" id="zoomIn" title="Zoom In (Ctrl++)">&#43;</button>
          <span class="zoom-level" id="zoomLevel">100%</span>
          <button class="btn btn-sm zoom-btn" id="zoomOut" title="Zoom Out (Ctrl+-)">&#8722;</button>
          <button class="btn btn-sm zoom-btn" id="zoomReset" title="Reset Zoom">&#8635;</button>
        </div>
        <div class="canvas-divider"></div>
        <button class="btn btn-sm canvas-undo" id="btnUndoWire" disabled title="Undo wire (Ctrl+Z)">&#8630;</button>
        <button class="btn btn-sm canvas-redo" id="btnRedoWire" disabled title="Redo wire (Ctrl+Y)">&#8631;</button>
        <select id="hardwareSelect" class="hardware-select" style="display:none">
          {% for profile in hardware_profiles %}
          <option value="{{ profile.id }}" data-code="{{ profile.default_code|e }}" data-components="led,rgb_led,button,oled,resistor,buzzer,potentiometer,dht11,ultrasonic" {% if profile.is_default %}selected{% endif %}>{{ profile.name }}</option>
          {% endfor %}
        </select>
        <button class="btn btn-sm canvas-fullscreen" id="btnFullscreen" title="Toggle Fullscreen">⛶</button>
        <span class="wiring-hint">Drag canvas to pan · Scroll to zoom</span>
      </div>
    </div>
    <svg id="hardwareCanvas" viewBox="0 0 780 520" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- ═══ GRADIENTS ═══ -->

        <!-- Arduino PCB board gradient -->
        <linearGradient id="arduino-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1a2d1f"/>
          <stop offset="40%" stop-color="#162818"/>
          <stop offset="100%" stop-color="#0d1c10"/>
        </linearGradient>

        <!-- Arduino board top highlight -->
        <linearGradient id="arduino-shine" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </linearGradient>

        <!-- LED lens highlight (radial) -->
        <radialGradient id="led-lens-grad" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
          <stop offset="45%" stop-color="rgba(255,255,255,0.08)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0.45)"/>
        </radialGradient>

        <!-- LED lens highlight for ON state -->
        <radialGradient id="led-lens-on" cx="32%" cy="28%" r="65%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
          <stop offset="50%" stop-color="rgba(255,255,255,0.2)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0.1)"/>
        </radialGradient>

        <!-- LED glow halos -->
        <radialGradient id="led-glow-red" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(255,32,32,0.7)"/>
          <stop offset="60%" stop-color="rgba(255,32,32,0.2)"/>
          <stop offset="100%" stop-color="rgba(255,32,32,0)"/>
        </radialGradient>
        <radialGradient id="led-glow-green" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(0,255,68,0.7)"/>
          <stop offset="60%" stop-color="rgba(0,255,68,0.2)"/>
          <stop offset="100%" stop-color="rgba(0,255,68,0)"/>
        </radialGradient>
        <radialGradient id="led-glow-blue" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(0,128,255,0.7)"/>
          <stop offset="60%" stop-color="rgba(0,128,255,0.2)"/>
          <stop offset="100%" stop-color="rgba(0,128,255,0)"/>
        </radialGradient>
        <radialGradient id="led-glow-yellow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(255,238,0,0.7)"/>
          <stop offset="60%" stop-color="rgba(255,238,0,0.2)"/>
          <stop offset="100%" stop-color="rgba(255,238,0,0)"/>
        </radialGradient>

        <!-- Button body gradient -->
        <linearGradient id="btn-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#22304a"/>
          <stop offset="100%" stop-color="#111822"/>
        </linearGradient>

        <!-- Button cap gradient -->
        <radialGradient id="btn-cap-grad" cx="38%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#e05555"/>
          <stop offset="60%" stop-color="#c03030"/>
          <stop offset="100%" stop-color="#901a1a"/>
        </radialGradient>

        <!-- Potentiometer body -->
        <linearGradient id="pot-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1e2d44"/>
          <stop offset="100%" stop-color="#0f1822"/>
        </linearGradient>

        <!-- Knob radial gradient -->
        <radialGradient id="pot-knob-grad" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#4a5a70"/>
          <stop offset="100%" stop-color="#1a2030"/>
        </radialGradient>

        <!-- Resistor body -->
        <linearGradient id="res-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#a07820"/>
          <stop offset="50%" stop-color="#8B6914"/>
          <stop offset="100%" stop-color="#6B4F0E"/>
        </linearGradient>

        <!-- Buzzer gradient -->
        <radialGradient id="buzzer-grad" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#2a2a3e"/>
          <stop offset="100%" stop-color="#0d0d1a"/>
        </radialGradient>

        <!-- DHT11 body gradient -->
        <linearGradient id="dht-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1e3a5f"/>
          <stop offset="100%" stop-color="#0f2040"/>
        </linearGradient>

        <!-- Ultrasonic board -->
        <linearGradient id="us-board-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1a2d1f"/>
          <stop offset="100%" stop-color="#0d1c10"/>
        </linearGradient>

        <!-- OLED frame -->
        <linearGradient id="oled-frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#181820"/>
          <stop offset="100%" stop-color="#0a0a12"/>
        </linearGradient>

        <!-- ═══ FILTERS ═══ -->
        <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity="0.65"/>
        </filter>
        <filter id="shadow-hard" x="-25%" y="-25%" width="150%" height="150%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/>
        </filter>
        <filter id="shadow-led" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
        </filter>

        <!-- Glow filters -->
        <filter id="glow-red" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-green" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-blue" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-yellow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-board" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00ff44" flood-opacity="0.15"/>
        </filter>

        <!-- Scanline pattern for OLED -->
        <pattern id="scanlines" x="0" y="0" width="1" height="2" patternUnits="userSpaceOnUse">
          <rect x="0" y="0" width="1" height="1" fill="rgba(0,0,0,0.18)"/>
        </pattern>
      </defs>

      <!-- ══════════════════════════════════════════════════════════
           ARDUINO UNO — Realistic Green PCB
           ══════════════════════════════════════════════════════════ -->
      <g class="component" id="comp-arduino" data-component="arduino" filter="url(#shadow-soft)">

        <!-- PCB body -->
        <rect x="30" y="30" width="220" height="460" rx="10" ry="10"
              fill="url(#arduino-body-grad)" stroke="#22441a" stroke-width="2"/>

        <!-- PCB top highlight sheen -->
        <rect x="31" y="31" width="218" height="220" rx="10" ry="10"
              fill="url(#arduino-shine)" pointer-events="none"/>

        <!-- Board label -->
        <text x="140" y="56" text-anchor="middle" fill="#1a7040"
              font-family="'JetBrains Mono',monospace" font-size="11" font-weight="800"
              letter-spacing="2">ARDUINO UNO R3</text>

        <!-- USB connector -->
        <rect x="110" y="14" width="60" height="24" rx="4"
              fill="#1a1a2e" stroke="#2a2a4e" stroke-width="1.5"/>
        <rect x="115" y="18" width="50" height="16" rx="2"
              fill="#111122" stroke="#333366" stroke-width="0.5"/>
        <text x="140" y="31" text-anchor="middle" fill="#2a2a5a"
              font-family="'JetBrains Mono',monospace" font-size="7">USB B</text>
        <!-- USB pins -->
        <rect x="120" y="20" width="4" height="10" rx="1" fill="#c0a060"/>
        <rect x="128" y="20" width="4" height="10" rx="1" fill="#c0a060"/>
        <rect x="136" y="20" width="4" height="10" rx="1" fill="#c0a060"/>
        <rect x="144" y="20" width="4" height="10" rx="1" fill="#c0a060"/>

        <!-- ATmega328P IC chip -->
        <rect x="90" y="215" width="100" height="60" rx="4"
              fill="#0c0c0c" stroke="#1a1a1a" stroke-width="1.5"/>
        <!-- IC legs left -->
        <line x1="85" y1="224" x2="90" y2="224" stroke="#888" stroke-width="1.5"/>
        <line x1="85" y1="233" x2="90" y2="233" stroke="#888" stroke-width="1.5"/>
        <line x1="85" y1="242" x2="90" y2="242" stroke="#888" stroke-width="1.5"/>
        <line x1="85" y1="251" x2="90" y2="251" stroke="#888" stroke-width="1.5"/>
        <line x1="85" y1="260" x2="90" y2="260" stroke="#888" stroke-width="1.5"/>
        <line x1="85" y1="269" x2="90" y2="269" stroke="#888" stroke-width="1.5"/>
        <!-- IC legs right -->
        <line x1="190" y1="224" x2="195" y2="224" stroke="#888" stroke-width="1.5"/>
        <line x1="190" y1="233" x2="195" y2="233" stroke="#888" stroke-width="1.5"/>
        <line x1="190" y1="242" x2="195" y2="242" stroke="#888" stroke-width="1.5"/>
        <line x1="190" y1="251" x2="195" y2="251" stroke="#888" stroke-width="1.5"/>
        <line x1="190" y1="260" x2="195" y2="260" stroke="#888" stroke-width="1.5"/>
        <line x1="190" y1="269" x2="195" y2="269" stroke="#888" stroke-width="1.5"/>
        <!-- IC notch and label -->
        <path d="M 90,215 Q 140,210 190,215" fill="none" stroke="none"/>
        <circle cx="97" cy="219" r="3" fill="none" stroke="#2a2a2a" stroke-width="1"/>
        <text x="140" y="243" text-anchor="middle" fill="#3a3a3a"
              font-family="'JetBrains Mono',monospace" font-size="7">ATmega328P</text>
        <text x="140" y="254" text-anchor="middle" fill="#2a2a2a"
              font-family="'JetBrains Mono',monospace" font-size="6">ARDUINO</text>

        <!-- Crystal oscillator -->
        <rect x="78" y="280" width="20" height="10" rx="2"
              fill="#888877" stroke="#555544" stroke-width="0.5"/>

        <!-- Power LED indicator (green) -->
        <circle cx="185" cy="82" r="4" fill="#00aa44"
                filter="url(#glow-green)" opacity="0.9">
          <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3s" repeatCount="indefinite"/>
        </circle>
        <text x="185" y="94" text-anchor="middle" fill="#1a6030"
              font-family="'JetBrains Mono',monospace" font-size="6">PWR</text>

        <!-- PCB traces (decorative) -->
        <path d="M 55 100 L 75 100" stroke="#1a5020" stroke-width="1" fill="none" opacity="0.4"/>
        <path d="M 55 166 L 75 166" stroke="#1a5020" stroke-width="1" fill="none" opacity="0.4"/>
        <path d="M 205 136 L 225 136" stroke="#1a5020" stroke-width="1" fill="none" opacity="0.4"/>
        <path d="M 205 154 L 225 154" stroke="#1a5020" stroke-width="1" fill="none" opacity="0.4"/>

        <!-- ── POWER PINS (left) ── -->
        <rect x="33" y="72" width="38" height="8" rx="2" fill="rgba(0,80,0,0.2)"/>
        <text x="52" y="79" text-anchor="middle" fill="#1a6030"
              font-family="'JetBrains Mono',monospace" font-size="7" font-weight="700">POWER</text>

        <circle class="pin-target" id="pin-arduino-5V"  data-component="arduino" data-pin="5V"  cx="55" cy="100" r="7"/>
        <text class="pin-label" x="70" y="104" fill="#ef4444" font-size="9">5V</text>
        <circle class="pin-target" id="pin-arduino-3V3" data-component="arduino" data-pin="3V3" cx="55" cy="122" r="7"/>
        <text class="pin-label" x="70" y="126" fill="#ef4444" font-size="9">3.3V</text>
        <circle class="pin-target" id="pin-arduino-VIN" data-component="arduino" data-pin="VIN" cx="55" cy="144" r="7"/>
        <text class="pin-label" x="70" y="148" fill="#ef4444" font-size="9">VIN</text>
        <circle class="pin-target" id="pin-arduino-GND" data-component="arduino" data-pin="GND" cx="55" cy="166" r="7"/>
        <text class="pin-label" x="70" y="170" fill="#4a7cb5" font-size="9">GND</text>

        <!-- ── DIGITAL PINS (right D0-D7) ── -->
        <rect x="209" y="72" width="38" height="8" rx="2" fill="rgba(0,80,0,0.2)"/>
        <text x="228" y="79" text-anchor="middle" fill="#1a6030"
              font-family="'JetBrains Mono',monospace" font-size="7" font-weight="700">DIGITAL</text>

        <circle class="pin-target" id="pin-arduino-D0"  data-component="arduino" data-pin="D0"  cx="225" cy="100" r="7"/>
        <text class="pin-label" x="210" y="104" fill="#22c55e" font-size="9" text-anchor="end">D0</text>
        <circle class="pin-target" id="pin-arduino-D1"  data-component="arduino" data-pin="D1"  cx="225" cy="118" r="7"/>
        <text class="pin-label" x="210" y="122" fill="#22c55e" font-size="9" text-anchor="end">D1</text>
        <circle class="pin-target" id="pin-arduino-D2"  data-component="arduino" data-pin="D2"  cx="225" cy="136" r="7"/>
        <text class="pin-label" x="210" y="140" fill="#22c55e" font-size="9" text-anchor="end">D2</text>
        <circle class="pin-target" id="pin-arduino-D3"  data-component="arduino" data-pin="D3"  cx="225" cy="154" r="7"/>
        <text class="pin-label" x="210" y="158" fill="#22c55e" font-size="9" text-anchor="end">D3~</text>
        <circle class="pin-target" id="pin-arduino-D4"  data-component="arduino" data-pin="D4"  cx="225" cy="172" r="7"/>
        <text class="pin-label" x="210" y="176" fill="#22c55e" font-size="9" text-anchor="end">D4</text>
        <circle class="pin-target" id="pin-arduino-D5"  data-component="arduino" data-pin="D5"  cx="225" cy="190" r="7"/>
        <text class="pin-label" x="210" y="194" fill="#22c55e" font-size="9" text-anchor="end">D5~</text>
        <circle class="pin-target" id="pin-arduino-D6"  data-component="arduino" data-pin="D6"  cx="225" cy="208" r="7"/>
        <text class="pin-label" x="210" y="212" fill="#22c55e" font-size="9" text-anchor="end">D6~</text>
        <circle class="pin-target" id="pin-arduino-D7"  data-component="arduino" data-pin="D7"  cx="225" cy="226" r="7"/>
        <text class="pin-label" x="210" y="230" fill="#22c55e" font-size="9" text-anchor="end">D7</text>

        <!-- gap separator -->
        <line x1="200" y1="252" x2="240" y2="252" stroke="#1a3020" stroke-width="0.5" stroke-dasharray="2,2"/>

        <!-- D8-D13 -->
        <circle class="pin-target" id="pin-arduino-D8"  data-component="arduino" data-pin="D8"  cx="225" cy="268" r="7"/>
        <text class="pin-label" x="210" y="272" fill="#22c55e" font-size="9" text-anchor="end">D8</text>
        <circle class="pin-target" id="pin-arduino-D9"  data-component="arduino" data-pin="D9"  cx="225" cy="286" r="7"/>
        <text class="pin-label" x="210" y="290" fill="#22c55e" font-size="9" text-anchor="end">D9~</text>
        <circle class="pin-target" id="pin-arduino-D10" data-component="arduino" data-pin="D10" cx="225" cy="304" r="7"/>
        <text class="pin-label" x="210" y="308" fill="#22c55e" font-size="9" text-anchor="end">D10~</text>
        <circle class="pin-target" id="pin-arduino-D11" data-component="arduino" data-pin="D11" cx="225" cy="322" r="7"/>
        <text class="pin-label" x="210" y="326" fill="#22c55e" font-size="9" text-anchor="end">D11~</text>
        <circle class="pin-target" id="pin-arduino-D12" data-component="arduino" data-pin="D12" cx="225" cy="340" r="7"/>
        <text class="pin-label" x="210" y="344" fill="#22c55e" font-size="9" text-anchor="end">D12</text>
        <circle class="pin-target" id="pin-arduino-D13" data-component="arduino" data-pin="D13" cx="225" cy="358" r="7"/>
        <text class="pin-label" x="210" y="362" fill="#22c55e" font-size="9" text-anchor="end">D13</text>

        <!-- ── ANALOG PINS (left) ── -->
        <rect x="33" y="302" width="38" height="8" rx="2" fill="rgba(0,80,0,0.2)"/>
        <text x="52" y="309" text-anchor="middle" fill="#1a6030"
              font-family="'JetBrains Mono',monospace" font-size="7" font-weight="700">ANALOG</text>

        <circle class="pin-target" id="pin-arduino-A0" data-component="arduino" data-pin="A0" cx="55" cy="320" r="7"/>
        <text class="pin-label" x="70" y="324" fill="#a78bfa" font-size="9">A0</text>
        <circle class="pin-target" id="pin-arduino-A1" data-component="arduino" data-pin="A1" cx="55" cy="338" r="7"/>
        <text class="pin-label" x="70" y="342" fill="#a78bfa" font-size="9">A1</text>
        <circle class="pin-target" id="pin-arduino-A2" data-component="arduino" data-pin="A2" cx="55" cy="356" r="7"/>
        <text class="pin-label" x="70" y="360" fill="#a78bfa" font-size="9">A2</text>

        <circle cx="706" cy="230" r="3" fill="none" stroke="#1a2a3a" stroke-width="1"/>

        <!-- Pin leads -->
        <line x1="520" y1="236" x2="520" y2="242" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
        <line x1="560" y1="236" x2="560" y2="242" stroke="#4a7cb5" stroke-width="2" stroke-linecap="round"/>
        <line x1="630" y1="236" x2="630" y2="242" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
        <line x1="670" y1="236" x2="670" y2="242" stroke="#d29922" stroke-width="2" stroke-linecap="round"/>

        <!-- Pins -->
        <circle class="pin-target" id="pin-oled-VCC" data-component="oled" data-pin="VCC" cx="520" cy="248" r="7"/>
        <circle class="pin-target" id="pin-oled-GND" data-component="oled" data-pin="GND" cx="560" cy="248" r="7"/>
        <circle class="pin-target" id="pin-oled-SDA" data-component="oled" data-pin="SDA" cx="630" cy="248" r="7"/>
        <circle class="pin-target" id="pin-oled-SCL" data-component="oled" data-pin="SCL" cx="670" cy="248" r="7"/>
        <text x="520" y="264" text-anchor="middle" fill="#ef4444" font-size="7" font-family="'JetBrains Mono',monospace">VCC</text>
        <text x="560" y="264" text-anchor="middle" fill="#4a7cb5" font-size="7" font-family="'JetBrains Mono',monospace">GND</text>
        <text x="630" y="264" text-anchor="middle" fill="#60a5fa" font-size="7" font-family="'JetBrains Mono',monospace">SDA</text>
        <text x="670" y="264" text-anchor="middle" fill="#d29922" font-size="7" font-family="'JetBrains Mono',monospace">SCL</text>
      </g>

      <!-- ══ RESISTOR template — 2D Realistic (Hidden) ══ -->
      <g class="component" id="comp-resistor" data-component="resistor" style="display:none">
        <text class="component-label" x="370" y="320" text-anchor="middle"
              font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1">220&#8486; RESISTOR</text>

        <!-- Lead wires -->
        <line x1="303" y1="343" x2="338" y2="343" stroke="#888" stroke-width="2" stroke-linecap="round"/>
        <line x1="402" y1="343" x2="437" y2="343" stroke="#888" stroke-width="2" stroke-linecap="round"/>

        <!-- Body -->
        <rect x="338" y="333" width="64" height="20" rx="4" ry="4"
              fill="url(#res-body-grad)" stroke="#6B4F12" stroke-width="1" filter="url(#shadow-hard)"/>
        <!-- Body highlight -->
        <rect x="339" y="334" width="62" height="8" rx="4" ry="4"
              fill="rgba(255,255,255,0.08)" pointer-events="none"/>

        <!-- Color bands (220Ω = Red Red Brown Gold) -->
        <rect x="348" y="333" width="5" height="20" rx="1" fill="#cc2222" opacity="0.9"/>
        <rect x="358" y="333" width="5" height="20" rx="1" fill="#cc2222" opacity="0.9"/>
        <rect x="368" y="333" width="5" height="20" rx="1" fill="#8B4513" opacity="0.9"/>
        <rect x="384" y="333" width="5" height="20" rx="1" fill="#c8a400" opacity="0.9"/>

        <!-- Tolerance stripe -->
        <rect x="393" y="333" width="3" height="20" rx="1" fill="#c8a400" opacity="0.7"/>

        <!-- Pins -->
        <circle class="pin-target" id="pin-resistor-pin1" data-component="resistor" data-pin="pin1" cx="296" cy="343" r="7"/>
        <circle class="pin-target" id="pin-resistor-pin2" data-component="resistor" data-pin="pin2" cx="444" cy="343" r="7"/>
        <text x="281" y="347" fill="#4a7cb5" font-size="8" text-anchor="end" font-family="'JetBrains Mono',monospace">1</text>
        <text x="459" y="347" fill="#4a7cb5" font-size="8" font-family="'JetBrains Mono',monospace">2</text>
      </g>

      <!-- ══ BUZZER template — 2D Realistic (Hidden) ══ -->
      <g class="component" id="comp-buzzer" data-component="buzzer" style="display:none">
        <text class="component-label" x="600" y="318" text-anchor="middle"
              font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1">PIEZO BUZZER</text>

        <!-- Outer ring / housing -->
        <circle cx="600" cy="358" r="26"
                fill="url(#buzzer-grad)" stroke="#2a2a4e" stroke-width="2" filter="url(#shadow-hard)"/>
        <!-- Inner ring -->
        <circle cx="600" cy="358" r="20" fill="none" stroke="#1a1a3a" stroke-width="1.5"/>
        <!-- Piezo disc -->
        <circle cx="600" cy="358" r="14" fill="#c8a400" stroke="#8b7000" stroke-width="1"/>
        <circle cx="600" cy="358" r="8"  fill="#a07800" stroke="#6b5000" stroke-width="0.5"/>
        <!-- Center dome -->
        <circle cx="600" cy="358" r="4"  fill="#444422"/>
        <!-- Top highlight -->
        <ellipse cx="592" cy="347" rx="6" ry="4" fill="rgba(255,255,255,0.06)" pointer-events="none"/>
        <!-- Polarity mark -->
        <text x="600" y="332" text-anchor="middle" fill="#ef4444"
              font-family="'JetBrains Mono',monospace" font-size="8">+</text>

        <!-- Sound ring animations (CSS driven) -->
        <circle class="buzzer-ring" cx="600" cy="358" r="30" fill="none"
                stroke="#6060ff" stroke-width="1" opacity="0.2"/>
        <circle class="buzzer-ring" cx="600" cy="358" r="36" fill="none"
                stroke="#6060ff" stroke-width="0.8" opacity="0.15"/>

        <!-- Pin leads -->
        <line x1="554" y1="358" x2="574" y2="358" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
        <line x1="626" y1="358" x2="646" y2="358" stroke="#4a7cb5" stroke-width="2" stroke-linecap="round"/>

        <!-- Pins -->
        <circle class="pin-target" id="pin-buzzer-pos" data-component="buzzer" data-pin="pos" cx="547" cy="358" r="7"/>
        <circle class="pin-target" id="pin-buzzer-neg" data-component="buzzer" data-pin="neg" cx="653" cy="358" r="7"/>
        <text x="532" y="362" fill="#ef4444" font-size="8" text-anchor="end" font-family="'JetBrains Mono',monospace">+</text>
        <text x="668" y="362" fill="#4a7cb5" font-size="8" font-family="'JetBrains Mono',monospace">−</text>
      </g>

      <!-- ══ SIM INDICATOR ══ -->
      <g id="simIndicator" visibility="hidden">
        <!-- Background pill -->
        <rect x="14" y="10" width="130" height="20" rx="10"
              fill="rgba(0,30,10,0.85)" stroke="#22c55e" stroke-width="1"/>
        <!-- Pulsing dot -->
        <circle cx="28" cy="20" r="5" fill="#22c55e">
          <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
          <animate attributeName="r" values="4;6;4" dur="1s" repeatCount="indefinite"/>
        </circle>
        <text x="40" y="25" fill="#22c55e"
              font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700"
              letter-spacing="1">SIMULATING</text>
      </g>

      <!-- Wire layer (always on top) -->
      <g class="wire-layer" id="wireLayer"></g>
    </svg>
  </div>
  </div>

  <!-- BOTTOM: Terminal Panel -->
  <div class="terminal-panel">
    <div class="terminal-header">
      <span class="header-title">Serial Monitor</span>
      <button class="btn btn-sm btn-clear" id="btnClear">Clear</button>
    </div>
    <div id="terminalOutput"></div>
  </div>
</div>
